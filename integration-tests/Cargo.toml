[package]
name = "mandatelock-sandbox-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[features]
sandbox-install = ["near-workspaces/install"]

[dependencies]
anyhow = "1"
base64 = "0.22"
borsh = "=1.8.1"
mandatelock = { path = ".." }
near-workspaces = { version = "=0.23.0", default-features = false, features = ["rustls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
