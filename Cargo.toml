[package]
name = "mandatelock"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = { version = "=1.8.1", features = ["derive"] }
near-account-id = "=2.6.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
near-sdk = "=5.29.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(near)"] }
